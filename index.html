<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAU → HYD Flight ML</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{font-family:Inter,Arial,sans-serif;max-width:1200px;margin:30px auto;padding:0 16px;background:#f7f7f8;color:#161616}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}.signal{font-size:20px;font-weight:700}.muted{color:#666}.metric{display:inline-block;padding:8px 12px;border-radius:10px;background:#f0f0f0;margin:3px}canvas{max-height:330px}</style></head>
<body><h1>GAU → HYD Flight Price ML</h1><div class="card" id="meta"></div><div class="card" id="model"></div><div id="root"></div><script>
async function main(){const d=await (await fetch('data/dashboard.json?t='+Date.now())).json();document.getElementById('meta').innerHTML=`<b>As of:</b> ${d.meta.as_of} &nbsp; <b>Decision horizon:</b> ${d.meta.decision_horizon_days} days &nbsp; <b>Learning data:</b> daily 30-departure-date sweep + exact target flights<br><span class="muted">Thresholds: large move = ${d.meta.drop_threshold_pct}%</span>`;
const m=d.model||{}; document.getElementById('model').innerHTML=`<b>Model:</b> ${m.status||'not started'} &nbsp; | &nbsp; <b>Daily retraining:</b> ON<br><span class="muted">Each horizon is trained from all eligible past observations; old forecasts are never rewritten.</span>`; const root=document.getElementById('root');d.series.forEach((s,i)=>{const id='c'+i;const card=document.createElement('div');card.className='card';card.innerHTML=`<h2>${s.target_date} · ${s.flight_no}</h2><div class="metric">Current ₹${Math.round(s.current_price)}</div><div class="metric">Pred. min ₹${Math.round(s.best_predicted_day.price)}</div><div class="signal">${s.signal}</div><div>Predicted min change: ${s.predicted_drop_pct}% · max increase: ${s.predicted_rise_pct}% · drop-risk: ${s.max_drop_probability}% · rise-risk: ${s.max_rise_probability}%</div><p class="muted">Potential lowest predicted day: ${s.best_predicted_day.date}</p><canvas id="${id}"></canvas>`;root.appendChild(card);const labels=[...s.history.map(x=>x.date),...s.forecast.map(x=>x.date)];const a=[...s.history.map(x=>x.price),...s.forecast.map(()=>null)];const p=[...s.history.map(()=>null),...s.forecast.map(x=>x.price)];new Chart(document.getElementById(id),{type:'line',data:{labels,datasets:[{label:'Actual',data:a,tension:.25},{label:'ML forecast',data:p,tension:.25}]},options:{responsive:true,plugins:{legend:{display:true}},scales:{y:{ticks:{callback:v=>'₹'+v}}}}});});}
main().catch(e=>document.body.innerHTML='<p>Dashboard data not available yet.</p>');</script></body></html>
